# Keeps the free Render API awake so the lecturer never waits ~50 s for a cold start.
# Render free web services sleep after 15 min without traffic; this pings every 10 min.
# One always-on free service uses ~744 of Render's 750 free instance-hours per month.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *" # GitHub may delay scheduled runs by a few minutes; that's fine
  workflow_dispatch: # "Run workflow" button for a manual ping

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API (wakes it if asleep)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://ledger-api-kdxz.onrender.com/api/survey/form/) && echo "API $code" && [ "$code" = "200" ] && break
            sleep 10
          done
      - name: Ping web app
        run: curl -s -o /dev/null -w "Web %{http_code}\n" --max-time 30 https://ledger-web-o3g3.onrender.com/
